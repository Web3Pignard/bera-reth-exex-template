[package]
name = "zg-reth-exex-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[dependencies]
reth = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1", features = ["full", "cli"] }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1", features = ["alloy-compat"] }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-network-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-execution-types = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Async and utilities
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1.41"

# Additional utilities
lazy_static = "1.4"
hex = "0.4"

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]
asm-keccak = ["reth/asm-keccak"]
min-debug-logs = ["reth/min-debug-logs"]
client = []

[dependencies.tikv-jemallocator]
version = "0.6.0"
optional = true

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

[[bin]]
name = "reth"
path = "src/main.rs"

