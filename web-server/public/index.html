<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staking Indexer - 数据查看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-button {
            padding: 12px 24px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .nav-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .nav-button.active {
            background: #764ba2;
            color: white;
        }
        
        .content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #667eea;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-item {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .address {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 16px;
        }

        .pagination-info {
            color: #555;
            font-size: 14px;
        }

        .pagination-btns {
            display: flex;
            gap: 8px;
        }

        .pagination-btns button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        a.address-link, a.tx-link {
            color: #667eea;
            text-decoration: none;
        }

        a.address-link:hover, a.tx-link:hover {
            text-decoration: underline;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        .events-table {
            table-layout: fixed;
            width: 100%;
            min-width: 800px;
        }

        .events-table th:nth-child(1), .events-table td:nth-child(1) { width: 12%; }
        .events-table .cell-tx { word-break: break-all; font-size: 0.85em; }

        @media (max-width: 900px) {
            .events-table tr {
                display: block;
                border: 1px solid #ddd;
                border-radius: 8px;
                margin-bottom: 12px;
                padding: 12px;
            }
            .events-table thead { display: none; }
            .events-table td {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                padding: 8px 0;
                border: none;
            }
            .events-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #555;
                min-width: 120px;
            }
        }

        .beacon-data {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-width: 420px;
            max-height: 200px;
            overflow: auto;
            margin: 0;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .beacon-data-none {
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Staking Indexer 数据查看</h1>
        
        <div class="nav">
            <button class="nav-button active" onclick="showSection('validators')">Validators</button>
            <button class="nav-button" onclick="showSection('delegators')">Delegators</button>
            <button class="nav-button" onclick="showSection('events')">Events</button>
        </div>
        
        <div class="content">
            <!-- Validators Section -->
            <div id="validators" class="section active">
                <h2>Validators</h2>
                <div class="filters">
                    <div class="filter-group">
                        <div class="filter-item">
                            <label for="filter-validator-address">Address:</label>
                            <input type="text" id="filter-validator-address" placeholder="0x... (可选)">
                        </div>
                        <div class="filter-item" style="display: flex; align-items: flex-end;">
                            <button onclick="loadValidators(1)">应用过滤</button>
                        </div>
                    </div>
                </div>
                <div id="validators-loading" class="loading">加载中...</div>
                <div id="validators-error" class="error" style="display: none;"></div>
                <div class="table-wrap">
                    <table id="validators-table" style="display: none;">
                        <thead>
                            <tr>
                                <th>Address</th>
                                <th>PubkeyHash</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody id="validators-tbody"></tbody>
                    </table>
                </div>
                <div id="validators-pagination" class="pagination" style="display: none;"></div>
                <div id="validators-empty" class="empty" style="display: none;">暂无数据</div>
            </div>
            
            <!-- Delegators Section -->
            <div id="delegators" class="section">
                <h2>Delegators</h2>
                <div class="filters">
                    <div class="filter-group">
                        <div class="filter-item">
                            <label for="filter-delegator-address">Address:</label>
                            <input type="text" id="filter-delegator-address" placeholder="0x... (可选)">
                        </div>
                        <div class="filter-item" style="display: flex; align-items: flex-end;">
                            <button onclick="loadDelegators(1)">应用过滤</button>
                        </div>
                    </div>
                </div>
                <div id="delegators-loading" class="loading">加载中...</div>
                <div id="delegators-error" class="error" style="display: none;"></div>
                <div class="table-wrap">
                    <table id="delegators-table" style="display: none;">
                        <thead>
                            <tr>
                                <th>Address</th>
                                <th>Total Delegated</th>
                                <th>Total Undelegated</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody id="delegators-tbody"></tbody>
                    </table>
                </div>
                <div id="delegators-pagination" class="pagination" style="display: none;"></div>
                <div id="delegators-empty" class="empty" style="display: none;">暂无数据</div>
            </div>
            
            <!-- Events Section -->
            <div id="events" class="section">
                <h2>Events</h2>
                <div class="filters">
                    <div class="filter-group">
                        <div class="filter-item">
                            <label for="filter-delegator">Delegator Address:</label>
                            <input type="text" id="filter-delegator" placeholder="0x...">
                        </div>
                        <div class="filter-item">
                            <label for="filter-validator">Validator Address:</label>
                            <input type="text" id="filter-validator" placeholder="0x...">
                        </div>
                        <div class="filter-item">
                            <label for="filter-event-type">Event Type:</label>
                            <select id="filter-event-type">
                                <option value="">全部</option>
                                <option value="0">0 - Delegate</option>
                                <option value="1">1 - Undelegate</option>
                                <option value="2">2 - WithdrawCommission</option>
                                <option value="3">3 - WithdrawTipFee</option>
                            </select>
                        </div>
                        <div class="filter-item" style="display: flex; align-items: flex-end;">
                            <button onclick="loadEvents()">应用过滤</button>
                        </div>
                    </div>
                </div>
                <div id="events-loading" class="loading">加载中...</div>
                <div id="events-error" class="error" style="display: none;"></div>
                <div class="table-wrap">
                    <table id="events-table" class="events-table" style="display: none;">
                        <thead>
                            <tr>
                                <th>Transaction Hash</th>
                                <th>Delegator Address</th>
                                <th>Validator Address</th>
                                <th>Event Type</th>
                                <th>Amount</th>
                                <th>Block Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="events-tbody"></tbody>
                    </table>
                </div>
                <div id="events-pagination" class="pagination" style="display: none;"></div>
                <div id="events-empty" class="empty" style="display: none;">暂无数据</div>
            </div>
        </div>
    </div>
    
    <script>
        const CHAINSCAN_BASE = 'https://chainscan.0g.ai';
        const PAGE_SIZE = 20;

        function showSection(sectionName) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionName).classList.add('active');
            event.target.classList.add('active');
            if (sectionName === 'validators') loadValidators(1);
            else if (sectionName === 'delegators') loadDelegators(1);
            else if (sectionName === 'events') loadEvents(1);
        }

        function renderPagination(containerId, page, total, pageSize, loadFn) {
            const el = document.getElementById(containerId);
            if (!el) return;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            if (total === 0 || totalPages <= 1) {
                el.style.display = 'none';
                return;
            }
            el.style.display = 'flex';
            el.innerHTML = `
                <span class="pagination-info">共 ${total} 条，第 ${page} / ${totalPages} 页</span>
                <div class="pagination-btns">
                    <button onclick="${loadFn}(${page - 1})" ${page <= 1 ? 'disabled' : ''}>上一页</button>
                    <button onclick="${loadFn}(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>下一页</button>
                </div>
            `;
        }

        const BEACON_VALIDATORS_URL = 'http://localhost:3500/eth/v1/beacon/states/head/validators';

        function normalizePubkey(pubkey) {
            if (!pubkey) return '';
            const p = String(pubkey).trim();
            return p.startsWith('0x') ? p.toLowerCase() : ('0x' + p).toLowerCase();
        }

        async function loadValidators(page) {
            page = page || 1;
            const loading = document.getElementById('validators-loading');
            const error = document.getElementById('validators-error');
            const table = document.getElementById('validators-table');
            const tbody = document.getElementById('validators-tbody');
            const empty = document.getElementById('validators-empty');
            const pagination = document.getElementById('validators-pagination');

            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            empty.style.display = 'none';
            pagination.style.display = 'none';

            try {
                const address = document.getElementById('filter-validator-address').value.trim();
                const params = new URLSearchParams({ page });
                if (address) params.append('address', address);

                const [validatorsRes, beaconRes] = await Promise.all([
                    fetch('/api/validators?' + params.toString()),
                    fetch(BEACON_VALIDATORS_URL).catch(() => null)
                ]);

                if (!validatorsRes.ok) throw new Error('Failed to fetch validators');
                const json = await validatorsRes.json();
                const { data, total } = json;

                let beaconByAddress = {};
                if (beaconRes && beaconRes.ok) {
                    const beacon = await beaconRes.json();
                    const list = beacon.data || [];
                    list.forEach(item => {
                        const withdrawal_credentials = item.validator && item.validator.withdrawal_credentials && normalizePubkey(item.validator.withdrawal_credentials);
                        if (withdrawal_credentials) beaconByAddress['0x' + withdrawal_credentials.slice(26)] = item;
                    });
                }

                loading.style.display = 'none';

                if (!data.length) {
                    empty.style.display = 'block';
                } else {
                    tbody.innerHTML = data.map(v => {
                        const url = CHAINSCAN_BASE + '/address/' + encodeURIComponent(v.address);
                        const addr = normalizePubkey(v.address);
                        const beaconItem = beaconByAddress[addr];
                        const dataCell = beaconItem
                            ? '<pre class="beacon-data">' + escapeHtml(JSON.stringify(beaconItem, null, 2)) + '</pre>'
                            : '<span class="beacon-data-none">—</span>';
                        return `<tr>
                            <td class="address"><a class="address-link" href="${url}" target="_blank" rel="noopener">${escapeHtml(v.address)}</a></td>
                            <td class="address">${escapeHtml(v.pubkey)}</td>
                            <td>${dataCell}</td>
                        </tr>`;
                    }).join('');
                    table.style.display = 'table';
                    renderPagination('validators-pagination', json.page, total, PAGE_SIZE, 'loadValidators');
                }
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '加载失败: ' + err.message;
                error.style.display = 'block';
            }
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        async function loadDelegators(page) {
            page = page || 1;
            const loading = document.getElementById('delegators-loading');
            const error = document.getElementById('delegators-error');
            const table = document.getElementById('delegators-table');
            const tbody = document.getElementById('delegators-tbody');
            const empty = document.getElementById('delegators-empty');
            const pagination = document.getElementById('delegators-pagination');

            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            empty.style.display = 'none';
            pagination.style.display = 'none';

            try {
                const address = document.getElementById('filter-delegator-address').value.trim();
                const params = new URLSearchParams({ page, with_events: '1' });
                if (address) params.append('address', address);

                const response = await fetch('/api/delegators?' + params.toString());
                if (!response.ok) throw new Error('Failed to fetch delegators');
                const json = await response.json();
                const { data, total } = json;

                loading.style.display = 'none';

                if (!data.length) {
                    empty.style.display = 'block';
                } else {
                    tbody.innerHTML = data.map(d => {
                        const url = CHAINSCAN_BASE + '/address/' + encodeURIComponent(d.address);
                        const dataPayload = d.data != null ? d.data : [];
                        const dataCell = dataPayload.length
                            ? '<pre class="beacon-data">' + escapeHtml(JSON.stringify(dataPayload, null, 2)) + '</pre>'
                            : '<span class="beacon-data-none">—</span>';
                        return `<tr>
                            <td class="address"><a class="address-link" href="${url}" target="_blank" rel="noopener">${escapeHtml(d.address)}</a></td>
                            <td>${escapeHtml(d.total_delegated)}</td>
                            <td>${escapeHtml(d.total_undelegated)}</td>
                            <td>${dataCell}</td>
                        </tr>`;
                    }).join('');
                    table.style.display = 'table';
                    renderPagination('delegators-pagination', json.page, total, PAGE_SIZE, 'loadDelegators');
                }
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '加载失败: ' + err.message;
                error.style.display = 'block';
            }
        }

        const eventTypeMap = { 0: 'Delegate', 1: 'Undelegate', 2: 'WithdrawCommission', 3: 'WithdrawTipFee' };

        async function loadEvents(page) {
            page = page || 1;
            const loading = document.getElementById('events-loading');
            const error = document.getElementById('events-error');
            const table = document.getElementById('events-table');
            const tbody = document.getElementById('events-tbody');
            const empty = document.getElementById('events-empty');
            const pagination = document.getElementById('events-pagination');

            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            empty.style.display = 'none';
            pagination.style.display = 'none';

            try {
                const delegator = document.getElementById('filter-delegator').value.trim();
                const validator = document.getElementById('filter-validator').value.trim();
                const eventType = document.getElementById('filter-event-type').value;
                const params = new URLSearchParams({ page });
                if (delegator) params.append('delegator_address', delegator);
                if (validator) params.append('validator_address', validator);
                if (eventType !== '') params.append('event_type', eventType);

                const response = await fetch('/api/events?' + params.toString());
                if (!response.ok) throw new Error('Failed to fetch events');
                const json = await response.json();
                const { data, total } = json;

                loading.style.display = 'none';

                if (!data.length) {
                    empty.style.display = 'block';
                } else {
                    const labels = ['Transaction Hash', 'Delegator Address', 'Validator Address', 'Event Type', 'Amount', 'Block Timestamp'];
                    tbody.innerHTML = data.map(e => {
                        const txHash = e.transaction_hash || '-';
                        const txCell = e.transaction_hash
                            ? `<a class="tx-link cell-tx" href="${CHAINSCAN_BASE}/tx/${encodeURIComponent(e.transaction_hash)}" target="_blank" rel="noopener">${e.transaction_hash}</a>`
                            : txHash;
                        const delegator_url = CHAINSCAN_BASE + '/address/' + encodeURIComponent(e.delegator_address);
                        const validator_url = CHAINSCAN_BASE + '/address/' + encodeURIComponent(e.validator_address);
                        const ts = e.block_timestamp ? new Date(e.block_timestamp * 1000).toLocaleString() : '-';
                        return `<tr>
                            <td data-label="${labels[0]}" class="cell-tx">${txCell}</td>
                            <td data-label="${labels[1]}" class="cell-tx"><a class="address-link" href="${delegator_url}" target="_blank" rel="noopener">${escapeHtml(e.delegator_address)}</a></td>
                            <td data-label="${labels[2]}" class="cell-tx"><a class="address-link" href="${validator_url}" target="_blank" rel="noopener">${escapeHtml(e.validator_address)}</a></td>
                            <td data-label="${labels[3]}">${e.event_type} (${eventTypeMap[e.event_type] || 'Unknown'})</td>
                            <td data-label="${labels[4]}">${e.amount || '-'}</td>
                            <td data-label="${labels[5]}">${ts}</td>
                        </tr>`;
                    }).join('');
                    table.style.display = 'table';
                    renderPagination('events-pagination', json.page, total, PAGE_SIZE, 'loadEvents');
                }
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '加载失败: ' + err.message;
                error.style.display = 'block';
            }
        }

        window.addEventListener('DOMContentLoaded', () => loadValidators(1));
    </script>
</body>
</html>
