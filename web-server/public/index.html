<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staking Indexer - 数据查看</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .nav-button {
            padding: 12px 24px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .nav-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        
        .nav-button.active {
            background: #764ba2;
            color: white;
        }
        
        .content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .section {
            display: none;
        }
        
        .section.active {
            display: block;
        }
        
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #667eea;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .filter-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-item {
            flex: 1;
            min-width: 200px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .address {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Staking Indexer 数据查看</h1>
        
        <div class="nav">
            <button class="nav-button active" onclick="showSection('validators')">Validators</button>
            <button class="nav-button" onclick="showSection('delegators')">Delegators</button>
            <button class="nav-button" onclick="showSection('events')">Events</button>
        </div>
        
        <div class="content">
            <!-- Validators Section -->
            <div id="validators" class="section active">
                <h2>Validators</h2>
                <div id="validators-loading" class="loading">加载中...</div>
                <div id="validators-error" class="error" style="display: none;"></div>
                <table id="validators-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Address</th>
                            <th>Pubkey</th>
                        </tr>
                    </thead>
                    <tbody id="validators-tbody"></tbody>
                </table>
                <div id="validators-empty" class="empty" style="display: none;">暂无数据</div>
            </div>
            
            <!-- Delegators Section -->
            <div id="delegators" class="section">
                <h2>Delegators</h2>
                <div id="delegators-loading" class="loading">加载中...</div>
                <div id="delegators-error" class="error" style="display: none;"></div>
                <table id="delegators-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Address</th>
                            <th>Total Delegated</th>
                            <th>Total Undelegated</th>
                        </tr>
                    </thead>
                    <tbody id="delegators-tbody"></tbody>
                </table>
                <div id="delegators-empty" class="empty" style="display: none;">暂无数据</div>
            </div>
            
            <!-- Events Section -->
            <div id="events" class="section">
                <h2>Events</h2>
                <div class="filters">
                    <div class="filter-group">
                        <div class="filter-item">
                            <label for="filter-delegator">Delegator Address:</label>
                            <input type="text" id="filter-delegator" placeholder="0x...">
                        </div>
                        <div class="filter-item">
                            <label for="filter-validator">Validator Address:</label>
                            <input type="text" id="filter-validator" placeholder="0x...">
                        </div>
                        <div class="filter-item">
                            <label for="filter-event-type">Event Type:</label>
                            <select id="filter-event-type">
                                <option value="">全部</option>
                                <option value="0">0 - Delegate</option>
                                <option value="1">1 - Undelegate</option>
                                <option value="2">2 - WithdrawCommission</option>
                                <option value="3">3 - WithdrawTipFee</option>
                            </select>
                        </div>
                        <div class="filter-item" style="display: flex; align-items: flex-end;">
                            <button onclick="loadEvents()">应用过滤</button>
                        </div>
                    </div>
                </div>
                <div id="events-loading" class="loading">加载中...</div>
                <div id="events-error" class="error" style="display: none;"></div>
                <table id="events-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>Delegator Address</th>
                            <th>Validator Address</th>
                            <th>Event Type</th>
                            <th>Amount</th>
                            <th>Shares</th>
                            <th>Transaction Hash</th>
                            <th>Block Number</th>
                            <th>Block Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="events-tbody"></tbody>
                </table>
                <div id="events-empty" class="empty" style="display: none;">暂无数据</div>
            </div>
        </div>
    </div>
    
    <script>
        function showSection(sectionName) {
            // 隐藏所有 section
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            
            // 显示选中的 section
            document.getElementById(sectionName).classList.add('active');
            event.target.classList.add('active');
            
            // 加载对应数据
            if (sectionName === 'validators') {
                loadValidators();
            } else if (sectionName === 'delegators') {
                loadDelegators();
            } else if (sectionName === 'events') {
                loadEvents();
            }
        }
        
        async function loadValidators() {
            const loading = document.getElementById('validators-loading');
            const error = document.getElementById('validators-error');
            const table = document.getElementById('validators-table');
            const tbody = document.getElementById('validators-tbody');
            const empty = document.getElementById('validators-empty');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            empty.style.display = 'none';
            
            try {
                const response = await fetch('/api/validators');
                if (!response.ok) throw new Error('Failed to fetch validators');
                
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (data.length === 0) {
                    empty.style.display = 'block';
                } else {
                    tbody.innerHTML = data.map(v => `
                        <tr>
                            <td class="address">${v.address}</td>
                            <td class="address">${v.pubkey}</td>
                        </tr>
                    `).join('');
                    table.style.display = 'table';
                }
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '加载失败: ' + err.message;
                error.style.display = 'block';
            }
        }
        
        async function loadDelegators() {
            const loading = document.getElementById('delegators-loading');
            const error = document.getElementById('delegators-error');
            const table = document.getElementById('delegators-table');
            const tbody = document.getElementById('delegators-tbody');
            const empty = document.getElementById('delegators-empty');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            empty.style.display = 'none';
            
            try {
                const response = await fetch('/api/delegators');
                if (!response.ok) throw new Error('Failed to fetch delegators');
                
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (data.length === 0) {
                    empty.style.display = 'block';
                } else {
                    tbody.innerHTML = data.map(d => `
                        <tr>
                            <td class="address">${d.address}</td>
                            <td>${d.total_delegated}</td>
                            <td>${d.total_undelegated}</td>
                        </tr>
                    `).join('');
                    table.style.display = 'table';
                }
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '加载失败: ' + err.message;
                error.style.display = 'block';
            }
        }
        
        async function loadEvents() {
            const loading = document.getElementById('events-loading');
            const error = document.getElementById('events-error');
            const table = document.getElementById('events-table');
            const tbody = document.getElementById('events-tbody');
            const empty = document.getElementById('events-empty');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            empty.style.display = 'none';
            
            try {
                const delegator = document.getElementById('filter-delegator').value.trim();
                const validator = document.getElementById('filter-validator').value.trim();
                const eventType = document.getElementById('filter-event-type').value;
                
                const params = new URLSearchParams();
                if (delegator) params.append('delegator_address', delegator);
                if (validator) params.append('validator_address', validator);
                if (eventType !== '') params.append('event_type', eventType);
                
                const response = await fetch('/api/events?' + params.toString());
                if (!response.ok) throw new Error('Failed to fetch events');
                
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (data.length === 0) {
                    empty.style.display = 'block';
                } else {
                    const eventTypeMap = {
                        0: 'Delegate',
                        1: 'Undelegate',
                        2: 'WithdrawCommission',
                        3: 'WithdrawTipFee'
                    };
                    
                    tbody.innerHTML = data.map(e => `
                        <tr>
                            <td class="address">${e.delegator_address || '-'}</td>
                            <td class="address">${e.validator_address || '-'}</td>
                            <td>${e.event_type} (${eventTypeMap[e.event_type] || 'Unknown'})</td>
                            <td>${e.amount || '-'}</td>
                            <td>${e.shares || '-'}</td>
                            <td class="address">${e.transaction_hash || '-'}</td>
                            <td>${e.block_number || '-'}</td>
                            <td>${e.block_timestamp ? new Date(e.block_timestamp * 1000).toLocaleString() : '-'}</td>
                        </tr>
                    `).join('');
                    table.style.display = 'table';
                }
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = '加载失败: ' + err.message;
                error.style.display = 'block';
            }
        }
        
        // 页面加载时加载 validators 数据
        window.addEventListener('DOMContentLoaded', () => {
            loadValidators();
        });
    </script>
</body>
</html>
